<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  /* :root tokens, *, body, button/.pf/.flagMark/#toast base rules now live
     in theme.css (shared with rankings-manager.html). Only this page's
     surface-specific sizing stays here. */
  #header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, #14170F, #0F1109);
    border-bottom: 2px solid var(--line2);
    padding: 10px 12px;
  }
  .brand { font-family: ui-monospace, monospace; font-weight: 800; font-size: 15px; color: var(--green); letter-spacing: -0.3px; }
  .sub { font-size: 10px; color: var(--dim); font-family: ui-monospace, monospace; letter-spacing: 1px; }
  /* ---- status bar (always visible) + collapsible settings drawer ---- */
  #statusBar { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
  #statusBar #status { flex: 1; margin-top: 0; }
  .iconBtn {
    background: transparent; color: var(--dim2); border: 1px solid var(--line2);
    padding: 4px 7px; font-size: 11px; line-height: 1; flex: none;
  }
  .iconBtn:hover { color: var(--text); border-color: var(--dim2); }
  .iconBtn.on { color: var(--green); border-color: var(--green); }
  #settingsPanel {
    overflow: hidden; max-height: 250px; transition: max-height .2s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity .2s ease;
    opacity: 1; border-top: 1px solid var(--line); margin-top: 7px; padding-top: 7px;
  }
  #settingsPanel.collapsed {
    max-height: 0; opacity: 0; margin-top: 0; padding-top: 0; border-top-color: transparent;
  }
  #connect { display: flex; gap: 6px; }
  #draftId {
    flex: 1; background: var(--bg); border: 1px solid var(--line2); border-radius: 4px;
    color: var(--text); padding: 6px 8px; font-size: 12px; font-family: ui-monospace, monospace;
  }
  #draftId:focus { outline: 1px solid var(--green); }
  button { padding: 6px 10px; } /* board buttons run smaller than the manager's — base rule in theme.css */
  #metaRow { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  #myRoster {
    width: 108px; background: var(--bg); border: 1px solid var(--line2); border-radius: 4px;
    color: var(--text); padding: 5px 7px; font-size: 11px; font-family: ui-monospace, monospace;
  }
  #myRoster:focus { outline: 1px solid var(--green); }
  #refreshRow { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  #refreshBtn {
    background: var(--gold); color: #1a1400; font-weight: 800; padding: 7px 12px; font-size: 12px;
    border-radius: 5px; letter-spacing: .5px;
  }
  #refreshBtn:active { transform: scale(0.96); }
  #refreshBtn.spin { opacity: 0.6; }
  #lastSync { font-size: 10px; color: var(--dim); font-family: ui-monospace, monospace; }
  #cacheCountdown { font-size: 10px; color: var(--dim); font-family: ui-monospace, monospace; margin-left: 8px; }
  #cacheCountdown.fresh { color: var(--green); }
  #status { margin-top: 6px; font-size: 10px; font-family: ui-monospace, monospace; color: var(--dim); }
  #status.live { color: var(--green); }
  #status.err { color: var(--red); }
  #status.pulse { animation: pulse .5s ease; }
  @keyframes pulse { 0%{opacity:.3} 100%{opacity:1} }

  /* ---- my-team position counts (shared widget) ---- */
  #teamCounts { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  #sourceList { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .cnt {
    font-family: ui-monospace, monospace; font-size: 10px; border: 1px solid var(--line2);
    border-radius: 4px; padding: 3px 7px; background: var(--panel);
  }
  .cnt b { font-size: 12px; }
  .teamHint { font-size: 9px; color: var(--dim); font-family: ui-monospace, monospace; letter-spacing: .5px; }

  /* ---- best picks right now (shared widget) ---- */
  #bestPicks { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 8px; }
  /* The board window is user-resizable — go 3-across only when there's room. */
  @media (min-width: 560px) { #bestPicks { grid-template-columns: repeat(3, 1fr); } }
  .bestCard {
    background: var(--panel); border: 1px solid var(--line2); border-radius: 6px;
    padding: 8px 10px; border-top: 3px solid; min-width: 0;
  }
  .bestTop { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .medal { font-family: ui-monospace, monospace; font-size: 8.5px; font-weight: 800; letter-spacing: 1px; }
  .posTeamChip {
    font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px; border: 1px solid;
    font-family: ui-monospace, monospace; white-space: nowrap; flex: none;
  }
  .bestName { font-size: 14px; font-weight: 700; margin-top: 5px; line-height: 1.15; }
  .statTiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .statTile { background: rgba(255,255,255,.03); border-radius: 4px; padding: 5px 7px; min-width: 0; }
  .statLabel { font-size: 8px; color: var(--dim); letter-spacing: .5px; font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .statValue { font-size: 13px; font-weight: 700; margin-top: 1px; font-family: ui-monospace, monospace; }
  .srcDots { display: flex; gap: 3px; margin-top: 7px; flex-wrap: wrap; }
  .dot {
    min-width: 20px; height: 17px; padding: 0 3px; border-radius: 4px; font-size: 8.5px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-family: ui-monospace, monospace; border: 1px solid transparent; color: #0B0D08;
  }
  .dot.solo { outline: 1.5px solid var(--gold); outline-offset: 1px; }
  .dot.has-icon { padding: 0; overflow: hidden; }
  .dot.has-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #soloBar { margin-top: 6px; font-size: 10px; font-family: ui-monospace, monospace; color: var(--gold); display: none; align-items: center; gap: 6px; }
  .empty { color: var(--dim); text-align: center; padding: 14px; font-size: 11px; }
  #best {
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 8px;
  }
  .best-cell { border-radius: 4px; padding: 5px 8px; border: 1px solid; min-width: 0; }
  .best-pos { font-size: 9px; font-family: ui-monospace, monospace; letter-spacing: 1px; opacity: .8; }
  .best-name { font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #filters { display: flex; gap: 4px; margin-top: 8px; }
  #playerSearch {
    flex: 1; min-width: 80px; background: var(--bg); border: 1px solid var(--line2); border-radius: 4px;
    color: var(--text); padding: 5px 8px; font-size: 11px; font-family: ui-monospace, monospace;
  }
  #playerSearch:focus { outline: 1px solid var(--green); }
  #playerSearch::placeholder { color: var(--dim); }
  .pf {
    background: transparent; border: 1px solid var(--line2); color: var(--dim2);
    padding: 4px 9px; font-size: 10px; cursor: pointer; transition: color .15s, border-color .15s;
  } /* :hover/.active states in theme.css */
  #board { padding: 10px 12px 30px; }
  .tier-head { display: flex; align-items: center; gap: 8px; margin: 12px 0 5px; }
  #board > .tier-head:first-child { margin-top: 0; }
  .tier-badge {
    width: 20px; height: 20px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-family: ui-monospace, monospace; font-size: 11px;
  }
  .tier-line { flex: 1; height: 1px; background: var(--line); }
  .tier-count { font-size: 9px; color: var(--dim); font-family: ui-monospace, monospace; }
  .row {
    display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid #1E2118; border-radius: 4px;
    padding: 5px 8px; margin-bottom: 3px; border-left: 3px solid;
    cursor: pointer; transition: opacity .15s, filter .15s;
  }
  .row:hover { filter: brightness(1.15); }
  .row.gone { opacity: 0.28; text-decoration: line-through; }
  .row.mine { outline: 1px solid var(--green); }
  .rk { font-family: ui-monospace, monospace; font-size: 10px; color: var(--dim); }
  .nm { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nm .tm { color: var(--dim); font-weight: 400; font-size: 10px; }
  .flagMark { margin-right: 3px; } /* .fav/.avoid colors in theme.css */
  .nm { cursor: context-menu; }
  /* ---- right-click flag menu (favorite/avoid) — right-click chosen specifically
     because double-click on the row already means "cross player off" (see the
     dblclick handler in panel.js); a floating menu was picked over inline pills
     or a tooltip so it never competes with the ADP columns/value bar for row space. */
  .flagMenu {
    position: fixed; z-index: 50; background: #1C1F16; border: 1px solid #3A3E2E; border-radius: 8px;
    padding: 4px; display: flex; flex-direction: column; min-width: 130px;
    box-shadow: 0 6px 16px rgba(0,0,0,.5); font-family: ui-monospace, monospace;
  }
  .flagMenu button {
    all: unset; padding: 7px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; white-space: nowrap;
  }
  .flagMenu button:hover { background: rgba(255,255,255,.08); }
  .flagMenu .fm-fav { color: var(--gold); }
  .flagMenu .fm-avoid { color: var(--red); }
  .flagMenu .fm-current { background: rgba(255,255,255,.06); }
  .flagMenu .fm-clear { color: var(--dim2); border-top: 1px solid var(--line2); margin-top: 2px; padding-top: 8px; }
  .pos-chip { font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px; border: 1px solid; font-family: ui-monospace, monospace; }
  .adp-cell { font-family: ui-monospace, monospace; font-size: 10px; text-align: right; white-space: nowrap; }
  /* ---- value/reach bar (Sleeper ADP vs. baseline ADP source) — matches rankings-manager.html, sized down for the panel's narrower width ----
     width:100% + justify-content:flex-end makes this right-align WITHIN its grid column, matching the numeric
     columns and the "VALUE" header above it — it used to be wrapped in a separately-centered .value-cell,
     which was the actual cause of the header/bar mismatch the user spotted (header right-aligned, bar centered). */
  .vbig { display: inline-flex; align-items: center; gap: 6px; font-family: ui-monospace, monospace; justify-content: flex-end; width: 100%; }
  .vbig-num { font-size: 9.5px; font-weight: 800; width: 22px; text-align: right; flex: none; }
  .vbig-track { position: relative; width: 56px; height: 12px; background: #1E2118; border-radius: 3px; overflow: hidden; flex: none; }
  .vbig-track::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line2); }
  .vbig-fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .vbig-empty { color: var(--dim); font-size: 10px; }
  /* ---- ADP column labels, shown once above the tiered board when any ADP source is enabled ----
     Horizontal padding (20px) intentionally matches #board's 12px + .row's own 8px combined —
     the label row lives OUTSIDE #board, so without this it drifts left of the actual columns. */
  #adpColLabels {
    display: grid; align-items: center; gap: 8px; padding: 4px 20px 2px;
    font-size: 9px; font-weight: 700; letter-spacing: .5px; color: var(--dim2);
    font-family: ui-monospace, monospace;
  }
  #adpColLabels span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  #adpColLabels span:first-child, #adpColLabels span:nth-child(2) { text-align: left; }
  #toast {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%) translateY(120%);
    background: var(--gold); color: var(--bg); padding: 7px 14px; border-radius: 5px;
    font-weight: 700; font-size: 11px; display: none; z-index: 50; max-width: 90%;
    font-family: ui-monospace, monospace; opacity: 0;
    transition: opacity .2s ease, transform .2s ease;
  } /* .show/.error states in theme.css */
</style>
</head>
<body>
  <div id="header">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="brand">4TH&amp;GO</span>
      <span class="sub" id="pickCounter"></span>
    </div>
    <div class="sub">SLEEPER LIVE SYNC · FULL PPR</div>

    <div id="statusBar">
      <span id="status">Not connected. Open your Sleeper draft room in a tab, or paste the draft ID below. Sleeper caches picks ~15s on their end, so the board updates within ~15-20s of a real pick.</span>
      <button id="openManager" class="iconBtn" title="Open the Rankings Manager">↗ MANAGER</button>
      <button id="settingsBtn" class="iconBtn" title="Show/hide setup &amp; sync settings">⚙</button>
    </div>

    <div id="settingsPanel">
      <div id="connect">
        <input id="draftId" placeholder="Sleeper draft ID (auto-detects from tab)" />
        <button id="connectBtn">SYNC</button>
        <button id="stopBtn" class="ghost" style="display:none">STOP</button>
      </div>
      <div id="metaRow">
        <input id="myRoster" type="number" min="1" placeholder="My draft slot #" title="Your draft slot / roster number — used to mark your own picks" />
      </div>
      <div id="refreshRow" style="display:none">
        <button id="refreshBtn">⟳ REFRESH NOW</button>
        <span id="lastSync"></span>
        <span id="cacheCountdown"></span>
      </div>
    </div>

    <div id="teamCounts"></div>
    <div id="sourceList"></div>
    <div id="bestPicks"></div>
    <div id="soloBar"><span id="soloLabel"></span><button id="showAllBtn" class="iconBtn">↺ SHOW ALL</button></div>
    <div id="best"></div>
    <div id="filters">
      <button class="pf active" data-pos="ALL">ALL</button>
      <button class="pf" data-pos="RB/WR" title="RB and WR only — no QB, no TE">RB/WR</button>
      <button class="pf" data-pos="QB">QB</button>
      <button class="pf" data-pos="RB">RB</button>
      <button class="pf" data-pos="WR">WR</button>
      <button class="pf" data-pos="TE">TE</button>
      <button class="pf" id="takenToggle" title="Also show drafted players, crossed out, at the current position filter">✕ SHOW TAKEN</button>
      <input type="text" id="playerSearch" placeholder="Search name or team…" />
    </div>
  </div>
  <div id="adpColLabels" style="display:none"></div>
  <div id="board"></div>
  <div id="toast"></div>
  <script src="rankings.js"></script>
  <script src="shared.js"></script>
  <script src="panel.js"></script>
</body>
</html>
